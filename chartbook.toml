Asset-weighted average by size quartile. Each quartile contains 25% of total banking assets. Banks are sorted by their initial total assets (first observation) and tracked over time.

### Quartiles

- Q1: Banks comprising smallest 25% of total assets
- Q2: Banks comprising next 25% of total assets
- Q3: Banks comprising next 25% of total assets
- Q4: Banks comprising largest 25% of total assets

### Data Source

WRDS Bank Regulatory Premium database

### Reference

Drechsler, Savov, and Schnabl (2017)
"""

[charts.gsib_lcr_proxy]
chart_name = "GSIB Proxy Liquidity Coverage Ratio"
short_description_chart = "Proxy LCR for 8 US GSIB holding companies derived from call report data"
dataframe_id = "ftsfr_gsib_lcr_bhc_panel"
path_to_html_chart = "./_output/gsib_lcr_proxy.html"
path_to_excel_chart = ""
topic_tags = ["banks", "regulatory", "LCR", "liquidity", "GSIB"]
past_publications = []
chart_docs_str = """
## GSIB Proxy Liquidity Coverage Ratio

Proxy LCR calculated from call report data for the 8 US GSIB holding companies.
Components are summed across all subsidiary banks under each BHC before computing the ratio.

### Methodology

- Level 1 HQLA: cash + Treasury securities + US government obligations
- Level 2A HQLA: agency MBS with 15% haircut, capped at 40% of total HQLA
- Outflows: Basel III standard runoff rates applied to deposit and liability categories
- LCR = Total HQLA / Total Net Cash Outflows (30-day)

### Data Source

WRDS Bank Regulatory Premium database (call reports)
"""

