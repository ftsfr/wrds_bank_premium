date_col = "ds"
docs = """
## GSIB Proxy LCR Panel (BHC Level)

Quarterly proxy Liquidity Coverage Ratio for 8 US GSIB holding companies.
Components are aggregated across all subsidiary banks under each BHC.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | BHC short name (e.g., JPMorgan Chase) |
| ds | Quarter-end date |
| y | Proxy LCR (percentage, e.g., 120.0 = 120%) |

### Methodology

LCR = HQLA / Net Cash Outflows (30-day).
HQLA uses Level 1 (cash, Treasuries, US gov) + Level 2A (agency MBS, 15% haircut, 40% cap).
Outflows use Basel III standard runoff rates on call report deposit and liability categories.
"""

