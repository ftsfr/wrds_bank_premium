[project]
name = "WRDS Bank Regulatory Premium"
description = "WRDS Bank Regulatory Premium database tables including call reports, CRSP linkage, and LEI data"
contributors = [
    "Jeremy Bejarano",
]
repo_url = "https://github.com/ftsfr/wrds_bank_premium"
copyright = "2025"
os_compatibility = [
    "Windows/Linux/MacOS (WRDS required)",
]
requires_chartbook = ">=0.3.0"

[scripts]
build = "doit"

[notebooks.summary_wrds_bank_premium]
name = "summary_wrds_bank_premium"
description = "Summary of WRDS Bank Regulatory Premium tables"
path = "_output/summary_wrds_bank_premium_ipynb.ipynb"
publishable = true

[dataframes.ftsfr_bank_total_assets]
name = "ftsfr_bank_total_assets"
description = "Bank total assets time series from call reports"
sources = [
    "WRDS Bank Regulatory Premium",
]
providers = [
    "WRDS",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu",
]
tags = [
    "banks",
    "regulatory",
    "call reports",
    "total assets",
]
access_types = [
    "WRDS",
]
license = "WRDS"
restrictions = "No"
pull_method = "WRDS Bank Regulatory Premium database"
path = "./_data/ftsfr_bank_total_assets.parquet"
date_col = "ds"
docs = """
## Bank Total Assets

Time series of bank total assets from WRDS Call Report Research data.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Bank RSSD ID |
| ds | Date |
| y | Total assets (bhck2170, in thousands) |

### Source Tables

This pipeline also provides access to:
- wrds_struct_rel_ultimate: Ultimate parent structure
- wrds_call_research: Full call report data
- wrds_bank_crsp_link: Bank to CRSP linkage
- idrssd_to_lei: RSSD to LEI mapping
- lei_main: Legal Entity Identifier data
"""

[dataframes.ftsfr_bank_total_assets_ew_quartile]
name = "ftsfr_bank_total_assets_ew_quartile"
description = "Bank total assets aggregated by size quartile (equal-weight)"
sources = [
    "WRDS Bank Regulatory Premium",
]
providers = [
    "WRDS",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu",
]
tags = [
    "banks",
    "regulatory",
    "total assets",
    "aggregated",
]
access_types = [
    "WRDS",
]
license = "WRDS"
restrictions = "No"
pull_method = "Aggregated from WRDS Bank Regulatory Premium database"
path = "./_data/ftsfr_bank_total_assets_ew_quartile.parquet"
date_col = "ds"
docs = """
## Bank Total Assets by Size Quartile (Equal-Weight)

Quarterly total assets aggregated by bank size quartile. Each quartile contains 25% of banks by count.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Quartile identifier (Q1_small_ew, Q2_ew, Q3_ew, Q4_large_ew) |
| ds | Date |
| y | Mean total assets (thousands) for quartile |

### Notes

- Banks are sorted by initial total assets (first observation)
- Equal-weight: simple mean of total assets within each quartile
- Q1 = smallest banks, Q4 = largest banks
"""

[dataframes.ftsfr_bank_total_assets_vw_quartile]
name = "ftsfr_bank_total_assets_vw_quartile"
description = "Bank total assets aggregated by size quartile (value-weight)"
sources = [
    "WRDS Bank Regulatory Premium",
]
providers = [
    "WRDS",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu",
]
tags = [
    "banks",
    "regulatory",
    "total assets",
    "aggregated",
]
access_types = [
    "WRDS",
]
license = "WRDS"
restrictions = "No"
pull_method = "Aggregated from WRDS Bank Regulatory Premium database"
path = "./_data/ftsfr_bank_total_assets_vw_quartile.parquet"
date_col = "ds"
docs = """
## Bank Total Assets by Size Quartile (Value-Weight)

Quarterly total assets aggregated by bank size quartile. Each quartile contains 25% of total banking assets.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Quartile identifier (Q1_small_vw, Q2_vw, Q3_vw, Q4_large_vw) |
| ds | Date |
| y | Asset-weighted mean total assets (thousands) for quartile |

### Notes

- Banks are sorted by initial total assets (first observation)
- Value-weight: asset-weighted mean of total assets within each quartile
- Q1 = smallest banks (by cumulative assets), Q4 = largest banks
- Shows where system-wide assets concentrate
"""

[charts.bank_total_assets_ew_quartile]
name = "Bank Total Assets by Size Quartile (Equal-Weight)"
description = "Average bank total assets by initial size quartile. Each quartile contains 25% of banks by count."
dataframe = "ftsfr_bank_total_assets_ew_quartile"
path = "./_output/bank_total_assets_ew_quartile.html"
tags = [
    "banks",
    "regulatory",
    "total assets",
    "aggregated",
]
publications = [
    "Drechsler, Savov, and Schnabl (2017) - The Deposits Channel of Monetary Policy",
]
docs = """
## Bank Total Assets by Size Quartile (Equal-Weight)

Average bank total assets by initial size quartile. Each quartile contains 25% of banks by count. Banks are sorted by their initial total assets (first observation) and tracked over time.

### Quartiles

- Q1: Smallest 25% of banks by count
- Q2: Second smallest 25%
- Q3: Second largest 25%
- Q4: Largest 25% of banks by count

### Data Source

WRDS Bank Regulatory Premium database

### Reference

Drechsler, Savov, and Schnabl (2017)
"""

[charts.bank_total_assets_vw_quartile]
name = "Bank Total Assets by Size Quartile (Value-Weight)"
