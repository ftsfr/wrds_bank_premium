name = "GSIB Proxy Liquidity Coverage Ratio"
description = "Proxy LCR for 8 US GSIB holding companies derived from call report data"
dataframe = "ftsfr_gsib_lcr_bhc_panel"
path = "./_output/gsib_lcr_proxy.html"
tags = [
    "banks",
    "regulatory",
    "LCR",
    "liquidity",
    "GSIB",
]
docs = """
## GSIB Proxy Liquidity Coverage Ratio

Proxy LCR calculated from call report data for the 8 US GSIB holding companies.
Components are summed across all subsidiary banks under each BHC before computing the ratio.

### Methodology

- Level 1 HQLA: cash + Treasury securities + US government obligations
- Level 2A HQLA: agency MBS with 15% haircut, capped at 40% of total HQLA
- Outflows: Basel III standard runoff rates applied to deposit and liability categories
- LCR = Total HQLA / Total Net Cash Outflows (30-day)

### Data Source

WRDS Bank Regulatory Premium database (call reports)
"""
